name: BitChord checks
on:
  push:
    paths: ['bitchord/**', '.github/workflows/bitchord-check.yml']
  pull_request:
    paths: ['bitchord/**', '.github/workflows/bitchord-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitchord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: git diff --exit-code -- manifest.json modules/
      - run: npm test
